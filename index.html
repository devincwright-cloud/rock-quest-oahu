<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a2342" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Rock Quest Oahu — snap rocks, build your Rock Dex, earn adventure badges across the island!" />
  <title>Rock Quest Oahu</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!--
    Physical spacer for notch / Dynamic Island.
    Must stay outside #app so SPA re-renders and full-screen overlays
    never collapse top safe-area padding (common iOS Safari bug).
  -->
  <div class="ios-safe-top" id="ios-safe-top" aria-hidden="true"></div>

  <div class="app-shell">
    <main id="app" class="app-main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main">
      <a href="#home" class="nav-item active" data-route="home">
        <span class="nav-ico">🏠</span>
        <span>Home</span>
      </a>
      <a href="#identify" class="nav-item" data-route="identify">
        <span class="nav-ico">📷</span>
        <span>Identify</span>
      </a>
      <a href="#dex" class="nav-item" data-route="dex">
        <span class="nav-ico">📘</span>
        <span>Dex</span>
      </a>
      <a href="#explore" class="nav-item" data-route="explore">
        <span class="nav-ico">🗺️</span>
        <span>Explore</span>
      </a>
      <a href="#path" class="nav-item" data-route="path">
        <span class="nav-ico">🛤️</span>
        <span>Path</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
